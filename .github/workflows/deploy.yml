name: Deploy Quicio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://quicio.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/quicio' }}
        run: npm run build

      - name: Check internal links
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://quicio.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/quicio' }}
        run: npm run links

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
