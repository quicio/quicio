name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: https://quicio.github.io
          BASE_PATH: /quicio
      - run: npm run links
        env:
          SITE_URL: https://quicio.github.io
          BASE_PATH: /quicio
